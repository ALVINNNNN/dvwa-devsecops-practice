# Minimizes the "Server" response header (Server Leaks Version Information).
# Apache doesn't support fully blanking this header without a custom module,
# so this reduces it from e.g. "Apache/2.4.25 (Debian)" down to just "Apache".
ServerTokens Prod
ServerSignature Off

# Set at the web-server layer (not in PHP) so these cover EVERY response,
# including static assets (css/images/robots.txt) that never run DVWA's PHP
# code and so never saw the equivalent header() calls there.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
