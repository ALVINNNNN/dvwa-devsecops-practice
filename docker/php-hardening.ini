; Hides the X-Powered-By header (Server Leaks Information via "X-Powered-By").
expose_php = Off

; Stops uncaught PHP notices/warnings/fatals from being rendered into
; responses (Application Error Disclosure / Debug Error Messages). Does not
; affect the SQLi labs' error-based technique, which echoes mysqli_error()
; explicitly in application code rather than relying on this setting.
display_errors = Off
log_errors = On
